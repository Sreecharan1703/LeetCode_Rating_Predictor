services:
  lcPred:
    build: .
    image: lcpredictor-app:latest
    container_name: lcpredictor-container
    ports:
      - "80:8080"
    networks:
      - lc_pred
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/lcPred?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  mysql:
    image: mysql:latest
    container_name: lcpred-mysql
    environment:
      MYSQL_DATABASE: lcPred
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - lc_pred
    volumes:
      - mysql_data:/var/lib/mysql

networks:
  lc_pred:
    driver: bridge

volumes:
  mysql_data: