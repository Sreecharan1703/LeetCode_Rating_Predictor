<!DOCTYPE html>
<!-- Add the Thymeleaf namespace -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - LeetcodePredictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F5F9;
      --surface: #FFFFFF;
      --ink: #12141C;
      --muted: #5E6475;
      --line: #E1E3EC;
      --dot: rgba(18, 20, 28, 0.09);
      --accent: #5A3FFF;
      --accent-hover: #4A30EB;
      --accent-soft: rgba(90, 63, 255, 0.10);
      --on-accent: #FFFFFF;
      --danger: #D92D3A;
      --danger-ink: #A61B27;
      --danger-soft: rgba(217, 45, 58, 0.08);
      --danger-line: rgba(217, 45, 58, 0.28);
      --shadow: 0 1px 2px rgba(18, 20, 28, 0.04), 0 12px 32px -8px rgba(18, 20, 28, 0.10);
      --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --font-body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0D0F16;
        --surface: #151824;
        --ink: #F2F3F8;
        --muted: #9AA1B5;
        --line: #272B3C;
        --dot: rgba(255, 255, 255, 0.07);
        --accent: #8F7DFF;
        --accent-hover: #A294FF;
        --accent-soft: rgba(143, 125, 255, 0.14);
        --on-accent: #0D0F16;
        --danger: #FF6B73;
        --danger-ink: #FFB3B8;
        --danger-soft: rgba(255, 107, 115, 0.10);
        --danger-line: rgba(255, 107, 115, 0.30);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px -8px rgba(0, 0, 0, 0.55);
      }
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink);
      background: transparent;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(60% 45% at 50% 0%, var(--accent-soft), transparent 70%),
        radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
      background-size: 100% 100%, 28px 28px;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
    }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .topbar { width: min(1040px, 100%); margin: 0 auto; padding: 22px 20px 0; }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--ink); text-decoration: none;
      font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 10px;
      display: grid; place-items: center;
      background: var(--accent); color: var(--on-accent);
    }

    main { flex: 1; display: grid; place-items: center; padding: 20px; }

    .gaming-card {
      width: 100%;
      max-width: 520px;
      padding: clamp(28px, 6vw, 44px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .error-icon {
      width: 56px; height: 56px;
      display: grid; place-items: center;
      margin-bottom: 22px;
      border-radius: 16px;
      background: var(--danger-soft);
      border: 1px solid var(--danger-line);
      color: var(--danger);
    }
    h2 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.7rem, 5vw, 2.2rem);
      line-height: 1.12;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }
    .error-lead { margin: 12px 0 0; color: var(--muted); }
    .error-message {
      margin: 14px 0 30px;
      padding: 16px 18px;
      border-radius: 14px;
      background: var(--danger-soft);
      border: 1px solid var(--danger-line);
      color: var(--danger-ink);
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    .btn-outline {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 26px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn-outline:hover { background: var(--accent-hover); }
    .btn-outline:active { transform: scale(0.98); }
    @media (max-width: 480px) { .btn-outline { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { .btn-outline { transition: none; } }
  </style>
</head>
